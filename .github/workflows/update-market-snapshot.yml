name: Update market snapshot

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This runs at 12:00 and 24:00 Asia/Hong_Kong.
    - cron: "0 4,16 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch market data snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/fetch-market-snapshot.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/market-snapshot.json data/market-snapshot.inline.js
          git diff --cached --quiet || git commit -m "chore: update market snapshot"
          git push
